# Alvos de deploy ECS. Copie para targets.conf e ajuste.
# Formato: T_<NOME>_<CAMPO>, NOME em maiusculas (nao alfanumerico vira "_").

T_APP_API_PROFILE="prod"
T_APP_API_ACCOUNT="111111111111"
T_APP_API_REGION="us-east-1"
T_APP_API_CLUSTER="example-prod-app"
T_APP_API_SERVICES="app-api-prod app-worker-prod"
# Opcional: ECR em outra conta, para validar a tag antes do deploy
T_APP_API_ECR_PROFILE="shared"
T_APP_API_ECR_ACCOUNT="222222222222"
T_APP_API_ECR_REGION="us-east-1"

T_APP_MCP_PROFILE="prod"
T_APP_MCP_ACCOUNT="111111111111"
T_APP_MCP_REGION="sa-east-1"
T_APP_MCP_CLUSTER="example-prod-mcp"
T_APP_MCP_SERVICES="app-mcp-prod"

T_APP_DATA_PROFILE="prod"
T_APP_DATA_ACCOUNT="111111111111"
T_APP_DATA_REGION="us-east-1"
T_APP_DATA_CLUSTER="example-prod-data"
T_APP_DATA_SERVICES="app-data-prod"
