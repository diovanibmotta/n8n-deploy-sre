services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-deploy-demo
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=${PUBLIC_URL:-http://localhost:5678/}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN}
      - REQUIRED_TAG=${REQUIRED_TAG:-env:prod}
      - WORKITEM_TYPE=${WORKITEM_TYPE:-Deploy}
      - AREA_PATH_PREFIX=${AREA_PATH_PREFIX:-}
      - ITERATION_PATH_PREFIX=${ITERATION_PATH_PREFIX:-}
      - LLM_MODEL=${LLM_MODEL}
      - ADO_PAT=${ADO_PAT}
      - ADO_ORG_URL=${ADO_ORG_URL}
      - ADO_PROJECT=${ADO_PROJECT}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./credentials:/credentials:ro
    depends_on:
      - rabbitmq
      - deployer

  rabbitmq:
    image: rabbitmq:3-alpine
    container_name: n8n-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=n8n
      - RABBITMQ_DEFAULT_PASS=n8n-local-only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/20-definitions.conf:/etc/rabbitmq/conf.d/20-definitions.conf:ro

  deployer:
    build: ./deployer
    container_name: n8n-deployer
    environment:
      - DEPLOY_CONFIG=/deploy/targets.conf
      - STATE_DIR=/state
      - HOME=/home/node
    volumes:
      - deploy_state:/state
      - ${AWS_DIR}:/home/node/.aws
      - ./scripts/deploy-ecs.sh:/deploy/deploy-ecs.sh:ro
      - ./targets.conf:/deploy/targets.conf:ro

volumes:
  n8n_data:
  rabbitmq_data:
  deploy_state:
